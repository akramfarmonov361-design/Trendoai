<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Ring Linear Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- T & AI Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas (Squircle / Rounded Box for Favicon) -->
  <rect width="512" height="512" rx="115" fill="#07090e" />
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Glassmorphic Halo Ring -->
  <circle cx="256" cy="256" r="195" fill="#0c1222" fill-opacity="0.75" stroke="url(#ringGrad)" stroke-width="12" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Futuristic Inner Orbit -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f472b6" stroke-width="4" stroke-dasharray="12 16" opacity="0.5" />

  <!-- 3D Monogram T and AI Neural Node -->
  <!-- T Top Bar -->
  <path d="M150 160 L362 160 C372 160 380 168 380 178 L380 205 C380 215 372 223 362 223 L288 223 L288 355 C288 368 276 380 262 380 L250 380 C236 380 224 368 224 355 L224 223 L150 223 C140 223 132 215 132 205 L132 178 C132 168 140 160 150 160 Z" fill="url(#monogramGrad)" filter="url(#neonGlow)" />

  <!-- Glowing AI Node (Dot) -->
  <circle cx="345" cy="330" r="24" fill="#f472b6" filter="url(#neonGlow)" />
  <circle cx="345" cy="330" r="10" fill="#ffffff" />

  <!-- Energy Bridge to Node -->
  <path d="M288 290 L345 330" stroke="#f472b6" stroke-width="8" stroke-linecap="round" opacity="0.8" />
</svg>
