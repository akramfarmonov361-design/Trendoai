<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Main Ring Linear Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtle Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1080" height="1080" fill="#07090e" />
  <circle cx="540" cy="500" r="500" fill="url(#bgGlow)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="540" cy="485" r="380" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.2" />

  <!-- Instagram Story Cutout Safe Guide Circle (Glassmorphic Container) -->
  <circle cx="540" cy="485" r="350" fill="#0c1222" fill-opacity="0.78" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="540" cy="485" r="350" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner High-Tech Dotted Ring -->
  <circle cx="540" cy="485" r="310" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="14 18" opacity="0.45" />

  <!-- Center Feature Icon -->
  <g>
    
            <!-- Sparkling Diamond -->
            <polygon points="540,390 670,470 540,610 410,470" fill="none" stroke="url(#grad)" stroke-width="24" stroke-linejoin="round"/>
            <polygon points="540,390 600,470 540,610 480,470" fill="url(#grad)" opacity="0.35"/>
            <line x1="410" y1="470" x2="670" y2="470" stroke="url(#grad)" stroke-width="18"/>
            <line x1="480" y1="470" x2="540" y2="390" stroke="#f472b6" stroke-width="16"/>
            <line x1="600" y1="470" x2="540" y2="390" stroke="#f472b6" stroke-width="16"/>
            <!-- Sparkles -->
            <circle cx="680" cy="410" r="10" fill="#f472b6"/>
            <circle cx="390" cy="550" r="8" fill="#f472b6"/>
        
  </g>

  <!-- Top Brand Tag -->
  <text x="540" y="220" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" opacity="0.75">TRENDO AI</text>

  <!-- Title Label -->
  <text x="540" y="930" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8">NARXLAR</text>

  <!-- Subtitle Label -->
  <text x="540" y="980" text-anchor="middle" fill="#f472b6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" opacity="0.9">SHAFFOF TARIFLAR</text>
</svg>