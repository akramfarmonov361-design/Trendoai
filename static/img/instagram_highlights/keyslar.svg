<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Main Ring Linear Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1080" height="1080" fill="#07090e" />
  <circle cx="540" cy="500" r="500" fill="url(#bgGlow)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="540" cy="485" r="380" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2" />

  <!-- Instagram Story Cutout Safe Guide Circle (Glassmorphic Container) -->
  <circle cx="540" cy="485" r="350" fill="#0c1222" fill-opacity="0.78" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="540" cy="485" r="350" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner High-Tech Dotted Ring -->
  <circle cx="540" cy="485" r="310" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 18" opacity="0.45" />

  <!-- Center Feature Icon -->
  <g>
    
            <!-- Rocket Launch -->
            <g transform="translate(540, 485) rotate(-45) translate(-540, -485)">
                <!-- Body -->
                <path d="M540 370 C600 420 600 520 580 570 L500 570 C480 520 480 420 540 370 Z" fill="url(#grad)" />
                <!-- Window -->
                <circle cx="540" cy="460" r="26" fill="#0b0f19" stroke="#38bdf8" stroke-width="10"/>
                <!-- Fins -->
                <path d="M490 530 L440 570 L485 570 Z" fill="#38bdf8"/>
                <path d="M590 530 L640 570 L595 570 Z" fill="#38bdf8"/>
                <!-- Flame -->
                <path d="M515 580 Q540 640 565 580 Z" fill="#fbbf24"/>
                <path d="M525 580 Q540 615 555 580 Z" fill="#f43f5e"/>
            </g>
        
  </g>

  <!-- Top Brand Tag -->
  <text x="540" y="220" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" opacity="0.75">TRENDO AI</text>

  <!-- Title Label -->
  <text x="540" y="930" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8">KEYSLAR</text>

  <!-- Subtitle Label -->
  <text x="540" y="980" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" opacity="0.9">PORTFOLIO & NATIJALAR</text>
</svg>