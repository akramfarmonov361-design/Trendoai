<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#fb7185" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Main Ring Linear Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Subtle Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1080" height="1080" fill="#07090e" />
  <circle cx="540" cy="500" r="500" fill="url(#bgGlow)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="540" cy="485" r="380" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.2" />

  <!-- Instagram Story Cutout Safe Guide Circle (Glassmorphic Container) -->
  <circle cx="540" cy="485" r="350" fill="#0c1222" fill-opacity="0.78" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="540" cy="485" r="350" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner High-Tech Dotted Ring -->
  <circle cx="540" cy="485" r="310" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="14 18" opacity="0.45" />

  <!-- Center Feature Icon -->
  <g>
    
            <!-- Dual Chat Bubbles with Star -->
            <!-- Main Bubble -->
            <path d="M400 400 H640 C680 400 710 430 710 470 V530 C710 570 680 600 640 600 H550 L470 650 V600 H400 C360 600 330 570 330 530 V470 C330 430 360 400 400 400 Z" fill="none" stroke="url(#grad)" stroke-width="22" stroke-linejoin="round"/>
            <!-- Central Star -->
            <polygon points="520,455 532,488 568,488 539,509 550,542 520,522 490,542 501,509 472,488 508,488" fill="#facc15"/>
        
  </g>

  <!-- Top Brand Tag -->
  <text x="540" y="220" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" opacity="0.75">TRENDO AI</text>

  <!-- Title Label -->
  <text x="540" y="930" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8">FIKRLAR</text>

  <!-- Subtitle Label -->
  <text x="540" y="980" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" opacity="0.9">MIJOZLAR SHARHLARI</text>
</svg>