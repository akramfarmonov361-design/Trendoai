<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Main Ring Linear Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtle Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1080" height="1080" fill="#07090e" />
  <circle cx="540" cy="500" r="500" fill="url(#bgGlow)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="540" cy="485" r="380" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2" />

  <!-- Instagram Story Cutout Safe Guide Circle (Glassmorphic Container) -->
  <circle cx="540" cy="485" r="350" fill="#0c1222" fill-opacity="0.78" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="540" cy="485" r="350" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner High-Tech Dotted Ring -->
  <circle cx="540" cy="485" r="310" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="14 18" opacity="0.45" />

  <!-- Center Feature Icon -->
  <g>
    
            <!-- Code Brackets & Chip -->
            <path d="M420 440 L340 500 L420 560" stroke="url(#grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M660 440 L740 500 L660 560" stroke="url(#grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M570 410 L510 590" stroke="#f472b6" stroke-width="24" stroke-linecap="round" fill="none"/>
            <circle cx="540" cy="500" r="14" fill="#f472b6"/>
        
  </g>

  <!-- Top Brand Tag -->
  <text x="540" y="220" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" opacity="0.75">TRENDO AI</text>

  <!-- Title Label -->
  <text x="540" y="930" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8">XIZMATLAR</text>

  <!-- Subtitle Label -->
  <text x="540" y="980" text-anchor="middle" fill="#f472b6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" opacity="0.9">IT & AI YECHIMLAR</text>
</svg>