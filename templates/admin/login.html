<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TrendoAI</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/admin-login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inline-styles.css') }}">
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <span class="logo-icon">🔥</span>
            <div class="logo-text">Trendo<span class="logo-highlight">AI</span></div>
        </div>

        <h2>🔐 Admin Panel</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="username">👤 Foydalanuvchi nomi</label>
                <input type="text" id="username" name="username" required placeholder="admin">
            </div>

            <div class="form-group">
                <label for="password">🔑 Parol</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit">Kirish →</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← Bosh sahifaga qaytish</a>
    </div>
</body>

</html>
