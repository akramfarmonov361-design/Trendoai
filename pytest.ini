[pytest]
# scripts/test_*.py fayllari test emas — ular import paytida kod bajaradigan
# qo'lda ishlatiladigan API tekshiruv skriptlari. Kolleksiyani tests/ bilan
# cheklamasak, oddiy `pytest` ularni yig'ib INTERNALERROR bilan yiqiladi.
testpaths = tests

# Testlar `from app import ...` qiladi, lekin tests/ ichida __init__.py yo'q,
# shuning uchun pytest sys.path ga faqat tests/ ni qo'shadi — loyiha ildizini
# emas. `python -m pytest` da ishlab ketardi (u CWD ni qo'shadi), yalang'och
# `pytest` da esa yo'q — CI aynan shu sababdan ModuleNotFoundError bergan.
pythonpath = .
