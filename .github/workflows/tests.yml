name: TrendoAI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Loyiha kodlarini yuklab olish
      uses: actions/checkout@v4

    - name: Python 3.11 ni o'rnatish
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Paketlarni tezroq yuklash uchun kesh

    - name: Kerakli paketlarni (dependencies) o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Pytest orqali barcha testlarni ishga tushirish
      env:
        # Test uchun muhim maxfiy kalitlarni mock (qalbaki) qilib beramiz
        SECRET_KEY: "test-secret-key"
        DATABASE_URL: "sqlite:///:memory:"
      run: |
        pytest tests/ -v
