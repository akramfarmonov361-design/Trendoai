name: Kunlik AI post

# Bu — zaxira trigger, asosiy emas. Ilova ichidagi APScheduler har kuni
# 04:00 UTC (09:00 Toshkent) da post chiqaradi va tarixga ko'ra ishlab
# turibdi. Ammo Render free tier'da servis uxlab qolsa yoki boot ketma-ketligi
# yiqilsa, scheduler umuman ishga tushmaydi — o'shanda shu workflow qutqaradi.
#
# Ataylab 2 soat kechroq ishlaydi: agar scheduler o'z ishini qilgan bo'lsa,
# scheduler.py dagi takrorlanish qalqoni buni ko'radi va o'tkazib yuboradi.
# Bir vaqtda ishga tushirilsa ikkalasi ham qalqondan o'tib ketishi mumkin edi,
# chunki qalqon generatsiya boshlanishida tekshiriladi, tugashida emas.

on:
  schedule:
    # 06:00 UTC = 11:00 Asia/Tashkent — scheduler'nikidan 2 soat keyin
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Servisni uyg'otish
        # Free tier cold start ~50 soniya davom etadi, shuning uchun
        # generatsiyani so'rashdan oldin servis oyoqqa turishini kutamiz.
        run: |
          curl -sS -m 180 --retry 4 --retry-all-errors --retry-delay 20 \
            -o /dev/null -w "uyg'otish: %{http_code} (%{time_total}s)\n" \
            https://trendoai.uz/api/health

      - name: Post generatsiyasini boshlash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub sekreti sozlanmagan." >&2
            exit 1
          fi
          # sync=1 — endpoint generatsiya tugaguncha kutadi va haqiqiy
          # natijani qaytaradi. Fon rejimida u ish boshlanmasdan turib
          # success:true qaytarardi, shuning uchun post chiqmagani hech
          # qachon ko'rinmasdi.
          #
          # Sekret sarlavhada yuboriladi — URL query'dagi sekretlar
          # proksi va server loglarida ochiq qolib ketadi.
          code=$(curl -sS -m 300 -o response.json -w "%{http_code}" \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "https://trendoai.uz/api/cron/generate?sync=1")
          cat response.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Post yaratilmadi (javob kodi: $code)" >&2
            exit 1
          fi
          # 200 ikki holatda keladi: post yaratildi, yoki takrorlanish
          # qalqoni to'sdi (bugun post allaqachon bor). Ikkalasi ham normal.
